<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Legend of YMIR - Bosses & Mineração</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="style.css">
    <style>
      

       
        /* Cartões estilo MMO */
        .boss-card {
            background: #161515;
            border: 1px solid #4d3e26;
            border-radius: 6px;
            padding: 20px;
            transition: .2s;
        }
        .boss-card:hover {
            background: #1f1e1d;
            border-color: #cfa85f;
        }

        .boss-name {
            font-size: 1.2rem;
            color: #e9d6af;
        }

        .boss-label {
            color: #cfa85f;
            font-weight: 600;
        }

        .gold-line {
            border-top: 1px solid rgba(255, 201, 125, 0.4);
            margin: 15px 0;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div include-html="front-end/layout/navbar.html"></div>

<script src="front-end/include.js"></script>

<div class="container">

    <!-- TÍTULO -->
    <h2 class="section-title">Bosses do Servidor</h2>

    <div class="row mt-4" id="bossList">

        <!-- EXEMPLO DE BOSS -->
        <!-- Será preenchido via JS abaixo -->

    </div>
</div>

<script>
/* ===========================
   LISTA DE BOSSES
=========================== */
const bosses = [
    {
        nome: "Fenrir Sombrio",
        dias: ["Seg", "Qua", "Sex", "Dom"],
        horarios: ["14:00", "20:00"]
    },
    {
        nome: "Guardião de Valhalla",
        dias: ["Ter", "Qui", "Sab"],
        horarios: ["18:30"]
    },
    {
        nome: "Arcanjo Caído",
        dias: ["Seg", "Ter", "Sab"],
        horarios: ["16:40", "22:10"]
    }
];

/* ===========================
   CALCULAR PRÓXIMO SPAWN
=========================== */
function proximoSpawn(boss) {
    let agora = new Date();
    let diaSemana = ["Dom","Seg","Ter","Qua","Qui","Sex","Sab"][agora.getDay()];

    // Hoje tem boss?
    if (boss.dias.includes(diaSemana)) {
        for (let h of boss.horarios) {
            let [hora, minuto] = h.split(":");
            let spawn = new Date();
            spawn.setHours(hora, minuto, 0);

            if (spawn > agora) return `${diaSemana} às ${h}`;
        }
    }

    // Próximo dia
    for (let d of boss.dias) {
        if (d !== diaSemana) return `${d} às ${boss.horarios[0]}`;
    }
}

/* ===========================
   GERAR CARDS
=========================== */
let container = document.getElementById("bossList");

bosses.forEach(boss => {
    let card = document.createElement("div");
    card.className = "col-md-4 mb-4";

    card.innerHTML = `
        <div class="boss-card">
            <div class="boss-name">${boss.nome}</div>

            <div class="gold-line"></div>

            <div class="boss-label">Dias:</div>
            <div>${boss.dias.join(", ")}</div>

            <div class="boss-label mt-2">Horários:</div>
            <div>${boss.horarios.join(", ")}</div>

            <div class="boss-label mt-3">Próximo Spawn:</div>
            <div style="color:#f8e2b8;">${proximoSpawn(boss)}</div>
        </div>
    `;

    container.appendChild(card);
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
