<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Visualizador de Minérios</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<link rel="stylesheet" href="nav.css">
    <link rel="stylesheet" href="style.css">

<style>
   
    #sidePanel { position:absolute;
    left:0;
    top:70px; /* altura do navbar */
    height:calc(100vh - 70px); padding:20px; background:rgba(10,15,30,0.92); border-right:2px solid #1e2a40; }
    #map {  position:absolute;
    right:0;
    top:70px; /* altura do navbar */
    width:calc(100vw - 400px);
    height:calc(100vh - 70px); }
    h3 { color:#7ab7ff; border-bottom:1px solid #304263; padding-bottom:6px; margin-bottom:15px; text-transform:uppercase; }
    .section-title { margin-top:20px; color:#8ab4ff; font-size:0.9rem; text-transform:uppercase; }
    .checkbox-futuristic { accent-color:#5ea1ff; }
</style>
</head>

<body>

    <div include-html="front-end/layout/navbar.html"></div>

    <script src="front-end/include.js"></script>

<div class="container">
<div  id="sidePanel">
    <h3>Minérios - Visualização</h3>

    <label class="section-title">Selecione o Mapa</label>
    <select id="mapSelect" class="form-select mb-3"></select>

    <label class="section-title">Filtros</label>
    <div class="form-check"><input class="form-check-input checkbox-futuristic" checked type="checkbox" value="aco" onchange="filtrar(this)"> Aço</div>
    <div class="form-check"><input class="form-check-input checkbox-futuristic" checked type="checkbox" value="linho" onchange="filtrar(this)"> Linho</div>
    <div class="form-check"><input class="form-check-input checkbox-futuristic" checked type="checkbox" value="cristal" onchange="filtrar(this)"> Cristal</div>
    <div class="form-check"><input class="form-check-input checkbox-futuristic" checked type="checkbox" value="bau" onchange="filtrar(this)"> Baú</div>
    <div class="form-check"><input class="form-check-input checkbox-futuristic" checked type="checkbox" value="baudourado" onchange="filtrar(this)"> Baú Dourado</div>
</div>

<div id="map"></div>
</div>
<script>
let map = L.map("map", { crs: L.CRS.Simple, minZoom: -4,  });
let bounds = [[0,0], [2000,4000]];
let overlay = null;
let marcadores = [];

let icons = {
    aco: L.icon({ iconUrl: "icons/aco.png", iconSize:[32,32] }),
    linho: L.icon({ iconUrl: "icons/linho.png", iconSize:[32,32] }),
    cristal: L.icon({ iconUrl: "icons/cristal.png", iconSize:[32,32] }),
    bau: L.icon({ iconUrl: "icons/bau.png", iconSize:[32,32] }),
    baudourado: L.icon({ iconUrl: "icons/baudourado.png", iconSize:[32,32] })
};

// ----------------------------
// Carregar lista de JSONs
// ----------------------------
fetch("mapas-prontos/index.json")
    .then(r => r.json())
    .then(lista => {
        let select = document.getElementById("mapSelect");

        lista.forEach(nome => {
            let opt = document.createElement("option");
            opt.value = nome;
            opt.textContent = nome.replace(".json","");
            select.appendChild(opt);
        });

        // Carrega o primeiro mapa automaticamente
        carregarMapa(lista[0]);
    });

// ----------------------------
// Carregar mapa selecionado
// ----------------------------
document.getElementById("mapSelect").addEventListener("change", function(){
    carregarMapa(this.value);
});

function carregarMapa(jsonNome){

    console.log("Carregando:", jsonNome);

    fetch("mapas-prontos/" + jsonNome)
        .then(r => r.json())
        .then(data => {

            // Remover overlay anterior
            if (overlay) map.removeLayer(overlay);

            // Adiciona imagem do mapa
            overlay = L.imageOverlay("maps/" + data.mapImage, bounds).addTo(map);
            map.fitBounds(bounds);

            // Remover marcadores antigos
            marcadores.forEach(m => map.removeLayer(m));
            marcadores = [];

            // Adicionar marcadores
            data.items.forEach(entry => {
                let m = L.marker([entry.y, entry.x], { icon: icons[entry.tipo] });
                m.tipo = entry.tipo;
                m.addTo(map);
                marcadores.push(m);
            });

        });
}

// ----------------------------
// FILTRO
// ----------------------------
function filtrar(chk){
    marcadores.forEach(m => {
        if(m.tipo === chk.value){
            if(chk.checked) m.addTo(map);
            else map.removeLayer(m);
        }
    });
}
</script>

</body>
</html>
