    universe: [PETR4.SA, VALE3.SA, ITUB4.SA, BBDC4.SA, BBAS3.SA, ABEV3.SA, WEGE3.SA, B3SA3.SA,
               ITSA4.SA, RENT3.SA, SUZB3.SA, PRIO3.SA, GGBR4.SA, AXIA3.SA, RADL3.SA, EQTL3.SA,
               LREN3.SA, VIVT3.SA, BPAC11.SA, RAIL3.SA]
