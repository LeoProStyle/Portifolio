<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroKey Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const gameTitle = params.get('title') || 'Game';
        const core = params.get('core') || 'nes';
        const romUrl = params.get('rom');
        const emuPath = '/emulator/';

        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_pathtodata = emuPath;
        window.EJS_gameUrl = romUrl;
        window.EJS_gameName = gameTitle;
        window.EJS_startOnLoaded = true;
        window.EJS_defaultControls = true;

        const script = document.createElement('script');
        script.src = `${emuPath}loader.js`;
        document.body.appendChild(script);
    </script>
</body>
</html>
