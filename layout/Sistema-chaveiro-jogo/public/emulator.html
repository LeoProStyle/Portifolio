<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroKey Emulator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: system-ui, -apple-system, sans-serif;
        }
        #game {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script type="application/json" id="rk-controls-contract">{"consoles":["nes","snes","n64","dmg","gbc","gba","sms","megadrive","gamegear","ps","arcade","neogeo"],"schemes":{"nes":"nes","snes":"snes","n64":"n64","dmg":"gb","gbc":"gb","gba":"gba","sms":"segaMS","megadrive":"segaMD","gamegear":"segaGG","ps":"psx","arcade":"arcade","neogeo":"arcade"},"keyCodes":["KeyA","KeyB","KeyC","KeyD","KeyE","KeyF","KeyG","KeyH","KeyI","KeyJ","KeyK","KeyL","KeyM","KeyN","KeyO","KeyP","KeyQ","KeyR","KeyS","KeyT","KeyU","KeyV","KeyW","KeyX","KeyY","KeyZ","Digit0","Digit1","Digit2","Digit3","Digit4","Digit5","Digit6","Digit7","Digit8","Digit9","Numpad0","Numpad1","Numpad2","Numpad3","Numpad4","Numpad5","Numpad6","Numpad7","Numpad8","Numpad9","NumpadEnter","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter","Space","Backspace","Comma","Period","Slash","Semicolon","Quote","BracketLeft","BracketRight","Minus","Equal","Backslash","Backquote","Insert","Delete","Home","End","PageUp","PageDown"],"gamepad":{"0":"BUTTON_2","1":"BUTTON_4","2":"SELECT","3":"START","4":"DPAD_UP","5":"DPAD_DOWN","6":"DPAD_LEFT","7":"DPAD_RIGHT","8":"BUTTON_1","9":"BUTTON_3","10":"LEFT_TOP_SHOULDER","11":"RIGHT_TOP_SHOULDER","12":"LEFT_BOTTOM_SHOULDER","13":"RIGHT_BOTTOM_SHOULDER","14":"LEFT_STICK","15":"RIGHT_STICK","16":"LEFT_STICK_X:+1","17":"LEFT_STICK_X:-1","18":"LEFT_STICK_Y:+1","19":"LEFT_STICK_Y:-1","20":"RIGHT_STICK_X:+1","21":"RIGHT_STICK_X:-1","22":"RIGHT_STICK_Y:+1","23":"RIGHT_STICK_Y:-1"},"analog":[16,17,18,19,20,21,22,23]}</script>
    <script>
        if (typeof window === 'undefined' || typeof document === 'undefined') {
            throw new Error('Emulator page must run in a browser environment.');
        }

        const params = new URLSearchParams(window.location.search);

        const gameTitle = params.get('title') || 'Game';
        const core = params.get('core') || 'nes';
        const romUrl = params.get('rom');

        // CDN oficial do EmulatorJS
        const EMULATORJS_CDN = 'https://cdn.emulatorjs.org/stable/data/';

        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_pathtodata = EMULATORJS_CDN;
        window.EJS_startOnLoaded = true;
        // Use the minified EmulatorJS bundle from the CDN. Enabling debug mode
        // forces non-minified files that are not available from the stable build.
        window.EJS_DEBUG_XX = false;
        window.EJS_defaultControls = true;

        // Controls contract mirrored from lib/emulator-controls.ts (0002F SF02, plan.md FD6).
        // tests/emulator-controls.test.ts compares this block with the module.
        const RK_CONTRACT = JSON.parse(document.getElementById('rk-controls-contract').textContent);
        const consoleParam = params.get('console');
        const consoleId = RK_CONTRACT.consoles.includes(consoleParam) ? consoleParam : null;
        const genesisCores = ['genesis_plus_gx', 'picodrive', 'smsplus'];

        window.EJS_defaultOptions = window.EJS_defaultOptions || {};
        // Keys reach the game only through the RetroKey listener below (FD2).
        window.EJS_defaultOptions.keyboardInput = 'disabled';
        window.EJS_defaultOptions.altKeyboardInput = 'disabled';

        if (consoleId) {
            // RN01: the scheme comes from the console id, never from the core (MS/GG share the Mega Drive core).
            window.EJS_controlScheme = RK_CONTRACT.schemes[consoleId];
            // FD2/FD4: no EmulatorJS keyboard key; the gamepad keeps the native EmulatorJS names.
            const player0 = {};
            for (let index = 0; index < 24; index++) {
                player0[index] = { value: '', value2: RK_CONTRACT.gamepad[String(index)] };
            }
            window.EJS_defaultControls = { 0: player0, 1: {}, 2: {}, 3: {} };
            // FD8: the RetroKey page draws the touch controller; the built-in one stays off.
            window.EJS_defaultOptions['virtual-gamepad'] = 'disabled';
            const hideBuiltInPad = document.createElement('style');
            hideBuiltInPad.textContent = '.ejs_virtualGamepad_parent{display:none!important}';
            document.head.appendChild(hideBuiltInPad);
            console.log('[RetroKey] Controls scheme', window.EJS_controlScheme, 'for', consoleId);
        } else {
            // Unknown console: EmulatorJS defaults, including its own touch gamepad (plan.md protocol).
            console.log('[RetroKey] No console id; EmulatorJS default controls for', core);
        }

        // Keyboard and touch input (0002F SF02, plan.md emulator.html protocol).
        const ANALOG = new Set(RK_CONTRACT.analog);
        const KEY_CODES = new Set(RK_CONTRACT.keyCodes);
        let bindings = new Map();
        const pressed = new Set();
        let warnedMissingApi = false;

        const inputApi = () => {
            const manager = window.EJS_emulator && window.EJS_emulator.gameManager;
            if (manager && typeof manager.simulateInput === 'function') return manager;
            if (!warnedMissingApi) {
                warnedMissingApi = true;
                console.warn('[rk] input API missing');
            }
            return null;
        };

        const setInput = (index, down) => {
            const manager = inputApi();
            if (!manager) return false;
            manager.simulateInput(0, index, down ? (ANALOG.has(index) ? 0x7fff : 1) : 0);
            if (down) pressed.add(index);
            else pressed.delete(index);
            return true;
        };

        const releaseAll = () => {
            for (const index of Array.from(pressed)) setInput(index, false);
            pressed.clear();
        };

        const handleKey = (event) => {
            if (!consoleId) return;
            const index = bindings.get(event.code);
            if (index === undefined) return;
            const down = event.type === 'keydown';
            if (down && event.repeat) {
                event.preventDefault();
                return;
            }
            if (setInput(index, down)) {
                event.preventDefault();
                event.stopPropagation();
            }
        };
        window.addEventListener('keydown', handleKey, true);
        window.addEventListener('keyup', handleKey, true);
        window.addEventListener('blur', releaseAll);

        const isIndex = (value) => Number.isInteger(value) && value >= 0 && value <= 23;
        const hasKeys = (data, keys) => {
            const own = Object.keys(data);
            return own.length === keys.length && keys.every((key) => Object.prototype.hasOwnProperty.call(data, key));
        };

        // Same check as parsePageMessage in lib/emulator-controls.ts. Returns null when invalid.
        const parsePageMessage = (data) => {
            if (!data || typeof data !== 'object' || Array.isArray(data)) return null;
            const proto = Object.getPrototypeOf(data);
            if (proto !== Object.prototype && proto !== null) return null;
            if (data.type === 'RK_RELEASE_ALL') return hasKeys(data, ['type']) ? data : null;
            if (data.type === 'RK_INPUT') {
                if (!hasKeys(data, ['type', 'index', 'pressed'])) return null;
                return isIndex(data.index) && typeof data.pressed === 'boolean' ? data : null;
            }
            if (data.type === 'RK_CONTROLS') {
                if (!hasKeys(data, ['type', 'console', 'bindings'])) return null;
                if (!consoleId || data.console !== consoleId) return null;
                if (!Array.isArray(data.bindings) || data.bindings.length > 24) return null;
                const next = new Map();
                for (const binding of data.bindings) {
                    if (!Array.isArray(binding) || binding.length !== 2) return null;
                    const code = binding[0];
                    const index = binding[1];
                    if (typeof code !== 'string' || !KEY_CODES.has(code) || !isIndex(index) || next.has(code)) return null;
                    next.set(code, index);
                }
                return { type: 'RK_CONTROLS', map: next };
            }
            return null;
        };

        // Callback executed when EmulatorJS emits ready
        window.EJS_ready = function() {
            console.log('[RetroKey] EJS_ready called - emulator initialized');
            try {
                if (window.EJS_emulator && window.EJS_emulator.controls) {
                    console.log('[RetroKey] Emulator controls (player 0):', window.EJS_emulator.controls[0]);
                } else {
                    console.log('[RetroKey] Emulator object not yet available to inspect controls');
                }
            } catch (e) {
                console.warn('[RetroKey] Error reading emulator controls', e);
            }
        };

        // Messages from the play page (components/Emulator.tsx): RN03 checks origin and window.
        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin || event.source !== window.parent) return;
            const type = event.data && event.data.type;
            if (type === 'RK_CONTROLS' || type === 'RK_INPUT' || type === 'RK_RELEASE_ALL') {
                const message = parsePageMessage(event.data);
                if (!message) {
                    console.warn('[rk] ignored message', String(type));
                    return;
                }
                if (message.type === 'RK_CONTROLS') {
                    releaseAll();
                    bindings = message.map;
                } else if (message.type === 'RK_INPUT') {
                    setInput(message.index, message.pressed);
                } else {
                    releaseAll();
                }
                return;
            }
            if (type !== 'RETROKEY_PAUSE' && type !== 'RETROKEY_RESUME') return;
            const emulator = window.EJS_emulator;
            if (!emulator) return;
            const pause = type === 'RETROKEY_PAUSE';
            try {
                if (pause && typeof emulator.pause === 'function') {
                    emulator.pause();
                } else if (!pause && typeof emulator.play === 'function') {
                    emulator.play();
                } else if (emulator.gameManager && typeof emulator.gameManager.toggleMainLoop === 'function') {
                    emulator.gameManager.toggleMainLoop(pause ? 0 : 1);
                }
            } catch (e) {
                console.warn('[RetroKey] pause/resume failed', e);
            }
        });

        // Light deterrent, same keys as components/useDevToolsGuard.ts: key presses inside this iframe
        // never reach the parent page. Off on localhost so development keeps the developer tools.
        const isLocalHost = ['localhost', '127.0.0.1', '[::1]'].includes(window.location.hostname);
        if (!isLocalHost) {
            window.addEventListener('keydown', (event) => {
                const key = (event.key || '').toLowerCase();
                const mod = event.ctrlKey || event.metaKey;
                const devKey = key === 'i' || key === 'j' || key === 'c';
                const blocked = key === 'f12'
                    || (mod && event.shiftKey && devKey)
                    || (event.metaKey && event.altKey && devKey)
                    || (mod && !event.shiftKey && key === 'u');
                if (blocked) {
                    event.preventDefault();
                    event.stopPropagation();
                }
            }, true);
            window.addEventListener('contextmenu', (event) => event.preventDefault(), true);
        }

        let canvasSignalSent = false;
        let canvasWatchTimer = null;
        let canvasObserver = null;
        let hasLoggedWaiting = false;

        const sendCanvasReadySignal = () => {
            if (canvasSignalSent) return;

            const canvas = document.querySelector('canvas');
            if (!canvas) {
                if (!hasLoggedWaiting) {
                    console.log('[RetroKey] Waiting canvas...');
                    hasLoggedWaiting = true;
                }
                return;
            }

            canvasSignalSent = true;
            if (canvasWatchTimer) {
                window.clearInterval(canvasWatchTimer);
                canvasWatchTimer = null;
            }
            if (canvasObserver) {
                canvasObserver.disconnect();
                canvasObserver = null;
            }

            canvas.setAttribute('tabindex', '0');
            canvas.focus?.();

            console.log('[RetroKey] Canvas detected');
            console.log('[RetroKey] Sending EMULATOR_CANVAS_READY');
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'EMULATOR_CANVAS_READY' }, window.location.origin);
            }
        };

        const startCanvasWatch = () => {
            console.log('[RetroKey] EmulatorJS loader loaded');
            console.log('[RetroKey] Waiting canvas...');
            sendCanvasReadySignal();

            canvasWatchTimer = window.setInterval(sendCanvasReadySignal, 250);
            canvasObserver = new MutationObserver(() => {
                sendCanvasReadySignal();
            });
            canvasObserver.observe(document.documentElement, {
                childList: true,
                subtree: true
            });
        };

        (async () => {
            console.log('[RetroKey] Loading ROM:', romUrl);

            const response = await fetch(romUrl);
            if (!response.ok) {
                console.error('ROM error', response.status);
                return;
            }

            const buffer = await response.arrayBuffer();
            console.log('[RetroKey] ROM loaded:', buffer.byteLength, 'bytes');

            const romBlob = new Blob([buffer], { type: 'application/octet-stream' });
            const romBlobUrl = typeof URL.createObjectURL === 'function'
                ? URL.createObjectURL(romBlob)
                : null;

            if (!romBlobUrl) {
                throw new Error('Unable to create a blob URL for the ROM.');
            }

            // EmulatorJS expects a real URL for the ROM, not an undefined path.
            window.EJS_gameUrl = romBlobUrl;
            window.EJS_gameData = buffer;
            console.log('[RetroKey] EJS_gameUrl set:', romBlobUrl);
            console.log('[RetroKey] EJS_gameData set:', typeof window.EJS_gameData, window.EJS_gameData instanceof ArrayBuffer ? 'ArrayBuffer' : 'unknown');

            const getExtensionFromContentDisposition = (header) => {
                if (!header) return null;
                const match = header.match(/filename\*=UTF-8''([^;\n\r]+)/i);
                if (match && match[1]) {
                    return match[1].split('.').pop();
                }
                const fallbackMatch = header.match(/filename="?([^";\n\r]+)"?/i);
                if (fallbackMatch && fallbackMatch[1]) {
                    return fallbackMatch[1].split('.').pop();
                }
                return null;
            };

            const contentDisposition = response.headers.get('content-disposition');
            const ext = getExtensionFromContentDisposition(contentDisposition) || 'zip';
            window.EJS_gameName = `${gameTitle}.${ext}`;

            // Sega 32X is a Mega Drive add-on that genesis_plus_gx does not emulate.
            // A .32x ROM registered as Mega Drive runs on picodrive instead; the Mega Drive
            // theme and controls stay the same.
            if (String(ext).toLowerCase() === '32x' && genesisCores.includes(core)) {
                window.EJS_core = 'picodrive';
                console.log('[RetroKey] 32X ROM detected, using picodrive core');
            }

            const script = document.createElement('script');
            script.src = EMULATORJS_CDN + 'loader.js';
            console.log('[RetroKey] Starting EmulatorJS loader:', script.src);
            script.onload = () => {
                startCanvasWatch();
            };
            script.onerror = () => {
                console.error('[RetroKey] Failed to load EmulatorJS loader');
            };

            document.body.appendChild(script);
        })();




    </script>
</body>
</html>
